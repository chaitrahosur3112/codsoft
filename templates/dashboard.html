<!DOCTYPE html>
<html>

<head>

<title>Task Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container mt-5">

<div class="card shadow-lg p-4">

<h2 class="text-center mb-4">TASK DASHBOARD</h2>

<form action="/add" method="POST" class="row g-3 mb-4">

<div class="col-md-5">
<input type="text" name="task" class="form-control" placeholder="Enter Task" required>
</div>

<div class="col-md-4">
<input type="date" name="deadline" class="form-control">
</div>

<div class="col-md-3">
<button class="btn btn-success w-100">Add Task</button>
</div>

</form>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>
<th>Task</th>
<th>Deadline</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody>

{% for task in tasks %}

<tr>

<td>{{task[2]}}</td>
<td>{{task[3]}}</td>
<td>

{% if task[4] == "Completed" %}

<span class="badge bg-success">Completed</span>

{% else %}

<span class="badge bg-warning text-dark">Pending</span>

{% endif %}

</td>

<td>

<a href="/complete/{{task[0]}}" class="btn btn-sm btn-primary">
Complete
</a>

<a href="/delete/{{task[0]}}" class="btn btn-sm btn-danger">
Delete
</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>

</html>
